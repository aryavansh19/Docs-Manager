<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DocsFlow">
  <title>DocsFlow</title>

  <!-- Brutalist card: heavy ink border on warm paper, matching the app's design system -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#101010" />
  <rect x="6" y="6" width="52" height="52" rx="11" fill="#fffcf7" />

  <!-- Document, tilted as if dropping into place -->
  <g transform="rotate(-8 32 32)">
    <path d="M20 15h15l9 9v25a3 3 0 0 1-3 3H23a3 3 0 0 1-3-3V18a3 3 0 0 1 3-3z"
          fill="#ffffff" stroke="#101010" stroke-width="3.2" stroke-linejoin="round" />
    <!-- Folded corner -->
    <path d="M35 15v9h9" fill="none" stroke="#101010" stroke-width="3.2" stroke-linejoin="round" />
    <!-- Text lines, the shortest tinted to echo the accent palette -->
    <path d="M26 32h12M26 38h12M26 44h7" stroke="#101010" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Filed-successfully mark -->
  <circle cx="46" cy="45" r="10" fill="#c8f04b" stroke="#101010" stroke-width="3.2" />
  <path d="M41.5 45.2l3.2 3.2 6-6.4" fill="none" stroke="#101010" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
