# Rate limit zones must live in the http context; files under sites-enabled are included
# there, so declaring them at the top of this file is valid.
#
# Nginx is the cheapest place to shed load: a rejected request never reaches Python and
# never touches a model. The box is scanned continuously by bots probing /.env,
# /.git/config, /actuator/env and similar, and the inference paths are CPU bound on a
# single process, so one abusive client could otherwise degrade the service for everyone.
limit_req_zone $binary_remote_addr zone=docsflow_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=docsflow_folders:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=docsflow_upload:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=docsflow_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    server_name api.docsflow.tech;
    client_max_body_size 30m;

    limit_conn docsflow_conn 20;

    # Meta bursts when several messages arrive together and retries on any slow reply, so
    # throttling this path would drop real documents. Authenticity is enforced instead by
    # HMAC signature verification in the application, which rejects forgeries with 401.
    location = /webhook {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/docsflow-proxy.conf;
    }

    # The most expensive endpoint: accepts an upload, then runs PDF extraction and OCR.
    # Nobody legitimately uploads a syllabus more than a few times in a row.
    location = /api/upload-syllabus {
        limit_req zone=docsflow_upload burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/docsflow-proxy.conf;
    }

    # Builds a Drive folder tree, so each call fans out into many Google API requests.
    location = /create-folders {
        limit_req zone=docsflow_folders burst=4 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/docsflow-proxy.conf;
    }

    # Generous enough that clicking through the dashboard never trips it, tight enough to
    # stop a scanner running hundreds of requests per second.
    location / {
        limit_req zone=docsflow_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/docsflow-proxy.conf;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.docsflow.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.docsflow.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.docsflow.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name api.docsflow.tech;
    return 404; # managed by Certbot
}
